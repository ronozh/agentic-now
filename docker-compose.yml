services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentic-postgres
    shm_size: 256mb # Docker's 64 MB default is tight for Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic
    ports:
      - "5433:5432" # 5432 is left for Langfuse's own Postgres (iteration 02)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
